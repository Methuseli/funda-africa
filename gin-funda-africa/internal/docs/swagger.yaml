          schema:
            $ref: '#/definitions/dto.NotFoundResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.InternalServerErrorResponse'
      security:
      - CookieAuth: []
      summary: Retrieve all curricula by country
      tags:
      - curricula
  /education/curricula/{id}:
