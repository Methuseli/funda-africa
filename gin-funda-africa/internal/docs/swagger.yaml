        name: page
        type: integer
      - default: 10
        description: Number of items per page
        in: query
        name: pageSize
        type: integer
      - description: Country where the curriculum is from
        in: query
        name: country
        type: string
      - description: Examining board for the curriculum
        in: query
        name: board
        type: string
      - description: Syllabus version
        in: query
        name: version
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CurriculumResponse'
            type: array
        "400":
          description: Bad request, validation error
          schema:
            $ref: '#/definitions/dto.BadRequestResponse'
        "401":
          description: Unauthorized, authentication required
          schema:
            $ref: '#/definitions/dto.UnauthorizedResponse'
        "403":
